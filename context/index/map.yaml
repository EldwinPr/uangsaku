  # issue builds on. The seven ERD tables at schemaVersion 1, one file per module,
  # plus AppDatabase and the committed v1 schema snapshot. Table declaration names
  # come from the class diagrams; column names from erd.drawio in snake_case.
  FEAT01:
    database:     app/lib/src/database/     # AppDatabase, appDatabaseProvider, seeding
    accounts:     app/lib/src/accounts/     # Accounts, AccountGroup
    transactions: app/lib/src/transactions/ # Transactions, Categories, Subcategories, TransactionKind
    budgeting:    app/lib/src/budgeting/    # BudgetGroups, BudgetPeriods
    settings:     app/lib/src/settings/     # Settings, Currency
    entrypoint:   app/lib/main.dart         # + app/lib/src/app.dart (MaterialApp root;
                                            # home is AppShell since FEAT02, 2026-08-24 -
                                            # F8's resolution, see the FEAT02 entry below)
    schema:       app/drift_schemas/        # generated snapshots, committed (drift.md)
    tests:        app/test/database/app_database_test.dart

