# UC/FEAT -> artifact index.
# Maps use cases to the design artifacts that specify them, and - from FEAT01
# onward - to the code that implements them. Code paths are added alongside the
# design artifacts, not instead of them.

# Distilled from pm/log-archive-2026-08.md on 2026-08-21: the failure patterns this
# project has hit more than once. decisions.md says what was decided; this says how the
# work goes wrong. Read before starting a task.
lessons: context/index/lessons.md

erd: docs/diagrams/erd.drawio

# ---------------------------------------------------------------------------
# Code. The Dart package lives in app/ (FEAT01 D9), so every path below is
# relative to the repository root and starts with app/.
# ---------------------------------------------------------------------------
code:
  # FEAT01-foundation, DONE 2026-08-21. No use case - it is the substrate every UC
  # issue builds on. The seven ERD tables at schemaVersion 1, one file per module,
  # plus AppDatabase and the committed v1 schema snapshot. Table declaration names
  # come from the class diagrams; column names from erd.drawio in snake_case.
  FEAT01:
    database:     app/lib/src/database/     # AppDatabase, appDatabaseProvider, seeding
    accounts:     app/lib/src/accounts/     # Accounts, AccountGroup
    transactions: app/lib/src/transactions/ # Transactions, Categories, Subcategories, TransactionKind
    budgeting:    app/lib/src/budgeting/    # BudgetGroups, BudgetPeriods
    settings:     app/lib/src/settings/     # Settings, Currency
    entrypoint:   app/lib/main.dart         # + app/lib/src/app.dart (MaterialApp root;
                                            # its home is UC-14's screen since 2026-08-22,
                                            # temporarily - FR-1 gives it to UC-01. Each
                                            # screen issue orphans the last: findings F8)
    schema:       app/drift_schemas/        # generated snapshots, committed (drift.md)
    tests:        app/test/database/app_database_test.dart

  # UC13-categories, DONE 2026-08-21. The first DAO, the first Notifier and the first
  # screen in the app. No schema change - Categories and Subcategories landed at FEAT01,
  # so schemaVersion stays 1 and drift_schema_v1.json is untouched. CategoryDao is a plain
  # class composing AppDatabase, not a DatabaseAccessor (decisions.md, 2026-08-21); both
  # providers are hand-written for the same reason.
  UC-13:
    dao:      app/lib/src/transactions/category_dao.dart              # watchTree/insert/update/delete
    providers: app/lib/src/transactions/transactions_providers.dart   # categoryTreeProvider, categoriesProvider
    screen:   app/lib/src/transactions/category_manager_screen.dart   # CategoryManagerScreen
    tests:
      - app/test/transactions/category_dao_test.dart
      - app/test/transactions/category_manager_screen_test.dart

  # UC11-set-budget, DONE 2026-08-22. The monthly amount per budget group, plus the
  # budget group CRUD re-scoped here from UC-13 on 2026-08-21. No schema change -
  # BudgetGroups and BudgetPeriods landed at FEAT01, so schemaVersion stays 1 and
  # drift_schema_v1.json is untouched (verified byte-identical at close). FR-15's
  # pre-fill is a FORM VALUE, not a row written ahead: nothing is written between the
  # screen opening and the owner saving, so a month never visited holds no row.
  # BudgetNotifier is a plain Notifier<AsyncValue<...>> with three hand-opened drift
  # subscriptions, NOT a StreamNotifier - see decisions.md 2026-08-22.
  UC-11:
    clock:     app/lib/src/budgeting/clock.dart                # Clock, the injected time source (D5)
    dao:       app/lib/src/budgeting/budget_dao.dart           # watchGroups/watchPeriods/upsert/delete + group CRUD
    providers: app/lib/src/budgeting/budgeting_providers.dart  # BudgetNotifier, budgetProvider, BudgetRow
    screen:    app/lib/src/budgeting/set_budget_screen.dart    # SetBudgetScreen
    tests:
      - app/test/budgeting/budget_dao_test.dart
      - app/test/budgeting/set_budget_screen_test.dart

  # UC14-choose-currency, DONE 2026-08-22. Halted 2026-08-21 at the planning gate and
  # unhalted when the owner answered Q1: changing the currency "just changes the prefix
  # thats all". So this issue re-labels and never converts - the stored int minor units
  # are untouched, and the exponent (enums.md: IDR 0, USD 2) is a rendering concern that
  # no code here applies. No schema change; Settings landed at FEAT01.
  UC-14:
    dao:       app/lib/src/settings/settings_dao.dart        # watchCurrency/setCurrency
    providers: app/lib/src/settings/settings_providers.dart  # currencyProvider (no autoDispose), SettingsNotifier as settingsProvider
    screen:    app/lib/src/settings/currency_screen.dart     # CurrencyScreen
    tests:
      - app/test/settings/settings_dao_test.dart
      - app/test/settings/currency_screen_test.dart

  # UC02-add-account, DONE 2026-08-22. The Accounts module's first DAO, provider and
  # screen. Create-only by the owner's Q2 ruling (pm/questions.md): rename/edit/delete
  # split to UC02B-edit-account, so no update()/delete() here and schemaVersion stays 1
  # (drift_schema_v1.json byte-identical). The opening amount is Accounts.openingAmount,
  # stored exactly as entered, signed - NO transaction row is written here for any
  # opening amount; kind=adjustment belongs to UC-03.
  UC-02:
    dao:       app/lib/src/accounts/account_dao.dart         # insert only (reads are UC-01/UC-10)
    providers: app/lib/src/accounts/accounts_providers.dart  # AccountsNotifier as accountsProvider
    screen:    app/lib/src/accounts/account_form_screen.dart # AccountFormScreen
    tests:
      - app/test/accounts/account_dao_test.dart
      - app/test/accounts/account_form_screen_test.dart

  # UC01-balance-sheet, DONE 2026-08-22. The primary screen (FR-1) and the app's
  # first cross-module SQL join - written inside AccountDao against the Transactions
  # table, never calling TransactionDao (component-overview D1). Read-only: no write
  # path exists on seq-uc01, so schemaVersion stays 1. Figures are sides-based sums
  # over Account.group with NO kind predicate and NO spending predicate - pinned
  # encoding-independent by a test that drives the same balance under both of Q4's
  # candidate adjustment encodings. No stored balance anywhere (NFR-2): every figure
  # is derived in SQL at read time. home is now BalanceSheetScreen permanently
  # (FR-1); AccountFormScreen joins F8's orphaned set.
  UC-01:
    dao:       app/lib/src/accounts/account_dao.dart          # + watchPosition/watchBalances, FinancialPosition, AccountBalance
    providers: app/lib/src/accounts/accounts_providers.dart   # + financialPositionProvider, accountBalancesProvider
    screen:    app/lib/src/accounts/balance_sheet_screen.dart # BalanceSheetScreen
    tests:
      - app/test/accounts/balance_queries_test.dart
      - app/test/accounts/balance_sheet_screen_test.dart

  # UC10-debt-progress, DONE 2026-08-22. FR-11's paid / remaining for one debt plus
  # markSettled(). paid = SUM(kind='repayment' rows touching the account) - the
  # repayment filter is also what severs Q4's only channel into this figure;
  # remaining = ABS(sides-based balance) with no kind filter, UC-01's expression shown
  # as a magnitude. settled is a boolean flag + clock-stamped date, NOT a lifecycle
  # (docs/statuses.md); no un-settle exists on any diagram. Join inside AccountDao per
  # component-overview D1. DebtDetailScreen ships unreachable (no navigation host) -
  # F8's fifth orphan and the first never reachable at any point.
  UC-10:
    dao:       app/lib/src/accounts/account_dao.dart          # + watchDebtProgress/setSettled, DebtProgress; Clock injected
    providers: app/lib/src/accounts/accounts_providers.dart   # + debtProgressProvider (autoDispose.family), AccountsNotifier.markSettled
    screen:    app/lib/src/accounts/debt_detail_screen.dart   # DebtDetailScreen
    tests:
      - app/test/accounts/debt_progress_test.dart
      - app/test/accounts/debt_detail_screen_test.dart

  # UC04-record-money-movement, DONE 2026-08-23. THE deliberate five-use-cases-one-form
  # exception: six writable kinds (expense/income/transfer/lend/borrow/repayment) through
  # ONE insert - the Transactions table's first write path. Sides come from enums.md's kind
  # table; no spending predicate appears anywhere in this module (FR-8/FR-9 fall out of the
  # row shape). TransactionDao also carries the two picker reads the component diagram
  # assigns here (watchAccounts/watchBudgetGroups) because ISSUE-005 D1 forbids calling
  # another module's DAO. The screen ships unreachable (F8, sixth orphan).
  UC-04:
    dao:       app/lib/src/transactions/transaction_dao.dart          # insert() + watchAccounts()/watchBudgetGroups()
    providers: app/lib/src/transactions/transactions_providers.dart   # + TransactionsNotifier/transactionsProvider (six record methods), accountPickerProvider, budgetGroupPickerProvider
    screen:    app/lib/src/transactions/record_transaction_screen.dart # RecordTransactionScreen
    tests:
      - app/test/transactions/transaction_dao_test.dart
      - app/test/transactions/transactions_notifier_test.dart
      - app/test/transactions/record_transaction_screen_test.dart

# ISSUE-005. One system-level diagram, all three modules. Shows what the per-module
# class diagrams cannot: the cross-module reads. Accounts and Transactions depend on
# each other in BOTH directions (balances need Transactions; the record screen needs
# the account picker), which is a real cycle and is drawn as two separate edges.
component_overview: docs/diagrams/component-overview.drawio

# ISSUE-006. The two vocabulary files, and the split between them: a status gates
# behaviour (and needs a state diagram), an enum classifies (and needs none).
# enums.md is the canonical source for Account.group and Transaction.kind - the ERD
# and the class diagrams name those columns, this says what may go in them.
vocabulary:
  enums:    docs/enums.md
  statuses: docs/statuses.md

# No state diagrams. Budget_Period was the only entity with a lifecycle; removing
# FR-16's lock on 2026-08-20 collapsed it (open/closed became a date comparison that
# gates nothing), so the diagram was deleted. docs/statuses.md records why, and lists
# no status values for any entity.

class_diagrams:
  # ISSUE-002. One per module. Chain drawn on all three:
  # Screen -> Riverpod provider -> DAO -> AppDatabase -> drift tables.
  # State management is Riverpod (decided 2026-08-20, decisions.md).
  Accounts:     {file: docs/diagrams/class-accounts.drawio,     ucs: [UC-01, UC-02, UC-03, UC-10]}
  Transactions: {file: docs/diagrams/class-transactions.drawio, ucs: [UC-04, UC-05, UC-06, UC-07, UC-08, UC-09, UC-13]}
  Budgeting:    {file: docs/diagrams/class-budgeting.drawio,    ucs: [UC-11, UC-12]}
  # ISSUE-007. Fourth module: the app-level currency setting belongs to none of the
  # three domain modules, and its value changes the meaning of every amount in all of them.
  Settings:     {file: docs/diagrams/class-settings.drawio,     ucs: [UC-14]}

# No explainers tracked. docs/diagrams/class-budgeting-draft.drawio was deleted
# 2026-08-20 once class_diagrams.Budgeting superseded it — it predated the Riverpod
# decision and still showed a "BudgetViewModel" plus a note saying state management
# was undecided, which is exactly the stale-doc failure decisions.md warns about.

entities:
  Account:       {modul: Accounts,     erd: docs/diagrams/erd.drawio, ucs: [UC-01, UC-02, UC-03, UC-04, UC-05, UC-06, UC-07, UC-08, UC-09, UC-10]}
  Transaction:   {modul: Transactions, erd: docs/diagrams/erd.drawio, ucs: [UC-01, UC-03, UC-04, UC-05, UC-06, UC-07, UC-08, UC-09, UC-10, UC-12]}
  Category:      {modul: Transactions, erd: docs/diagrams/erd.drawio, ucs: [UC-04, UC-05, UC-09, UC-13]}
  Subcategory:   {modul: Transactions, erd: docs/diagrams/erd.drawio, ucs: [UC-04, UC-05, UC-09, UC-13]}
  # UC-13 dropped 2026-08-21: budget group CRUD moved to UC-11, the module that owns the
  # entity (decisions.md). UC-04/05/09 remain -- they tag a transaction with a group
  # rather than managing the group itself.
  Budget_Group:  {modul: Budgeting,    erd: docs/diagrams/erd.drawio, ucs: [UC-04, UC-05, UC-09, UC-11, UC-12]}
  Budget_Period: {modul: Budgeting,    erd: docs/diagrams/erd.drawio, ucs: [UC-09, UC-11, UC-12]}
  Settings:      {modul: Settings,     erd: docs/diagrams/erd.drawio, ucs: [UC-14]}
