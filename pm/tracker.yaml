    depends_on: [UC01-balance-sheet, UC13-categories]
    traces_to: [UC-04, UC-05, UC-06, UC-07, UC-08]
    summary: >-
      THE DELIBERATE EXCEPTION to one-issue-per-UC. Expense, income, transfer, lend and
      borrow are one form and one write path by schema decision - ERD D1 put all seven kinds
      in one ledger table precisely so there would be one insert path, not five. Splitting
