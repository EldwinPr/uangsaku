    status: DONE
    plan: pm/issues/008-sequence-conventions/plan.md
    depends_on: [ISSUE-002]
    traces_to: []
    summary: >-
      The last missing diagram-type convention, and the one gating every implementation
      plan - CLAUDE.md makes the sequence diagram the scope boundary of an issue. DONE
      2026-08-20, and renumbered from ISSUE-015 to ISSUE-008 the same day once the
      ISSUE-008..014 backlog rows were replaced by UC-coded ids and left a gap.
      Distilled from UML 2.5.1 Clause 17 plus the three worked examples, which
      turned out to be MERMAID-GENERATED - so this is the only diagram type in the project
      authored as Mermaid and converted, rather than hand-written XML. Two rules carry the
      weight: every lifeline must be a class that already exists on a class diagram, and a
      write gets no reply arrow because results arrive on the read path as a stream
      emission. diagram-drawio-author's scope extended to match.

