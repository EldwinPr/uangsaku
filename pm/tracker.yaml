  - id: ISSUE-007
    slug: currency
    title: Currency - one app-level setting, amounts as integer minor units
    status: DONE
    plan: pm/issues/007-currency/plan.md
    depends_on: [ISSUE-001, ISSUE-006]
    traces_to: [UC-01, UC-02, UC-03, UC-04, UC-05, UC-06, UC-07, UC-08, UC-09, UC-11, UC-12, UC-14]
    summary: >-
      Closes the last schema-blocking fr-nfr.md section 4 item. Owner asked for multi-currency
      (IDR/USD/CNY), withdrew it the same message once the cost was raised, and settled on one
      app-level currency chosen at setup. Owner proposed `double` for amounts; pushed back once
      on NFR-2 grounds and the owner accepted `int` minor units (IDR exponent 0, USD exponent 2).
      DONE 2026-08-20. FR-19 added and promoted to UC-14, which forced a fourth module (Settings)
      because currency belongs to none of the three domain modules - and that in turn added a
      fourth class diagram, a Settings box on the component diagram, and a Settings entity on the
      ERD (drawn with no relationship line: its coupling is interpretive, not referential).
      All renders visually verified. Six artifacts touched by what looked like one column.

  - id: ISSUE-009
    slug: coding-conventions
    title: context/coding-conventions/
    status: DONE
    plan: pm/issues/009-coding-conventions/plan.md
    depends_on: [ISSUE-002]
    traces_to: []
    summary: >-
      Stack conventions for Flutter/Dart, drift and Riverpod, written at the owner's request
      slightly ahead of the point general-rules.md expects them. DONE 2026-08-20: six files
      grounded in official sources plus the decisions already recorded, and explicitly marked
      PROVISIONAL - nothing in them has been checked against code, because none exists and no
      Dart SDK is installed. Load-bearing content: class names in code must match the class
      diagrams exactly; every amount is an int minor unit and never a double; a write returns
      nothing to the screen because results arrive on the read path; and two requirements get
      explicit tests (NFR-4's zero refusals, FR-18's full CRUD). Also answers the MCP
      question - the official Dart/Flutter MCP server ships with the SDK and cannot be added
      until Flutter is installed.

  # ---------------------------------------------------------------------------
  # Implementation backlog. Re-cut 2026-08-20 from seven vertical slices to one
  # issue per use case, at the owner's request.
  #
  # ID scheme: an implementation issue takes the code of the use case it builds,
  # `UC{NN}-{slug}`. Note the missing hyphen - the workbook Kode is `UC-01`, the
  # issue implementing it is `UC01-balance-sheet`. They are deliberately
  # near-identical and that hyphen is the only thing separating them; `traces_to`
  # always carries the workbook form.
  #
  # Work with no use case takes a `FEAT{NN}` code instead, matching the "UC/FEAT"
  # vocabulary context/index/map.yaml already uses. The scaffold is the only one:
  # it has no actor and no workbook row, and saying so is more honest than
  # attaching it to whichever use case happens to be built first.
  #
  # Why one issue per UC: the workbook is the spine, map.yaml indexes by UC, and
  # the close checklist marks a workbook row implemented - so a 1:1 chain beats a
  # union. The decisive reason is CLAUDE.md making a plan's scope its sequence
  # diagram, and sequence-conventions.md drawing one diagram per use case: one UC
  # = one diagram = one plan scope is the tightest reading of that gate.
  #
  # Two deliberate exceptions, both argued on their rows: FEAT01 (no UC exists
  # for it) and UC04 (five use cases, one form, one write path - splitting it
  # would fight ERD D1).
  #
  # FEAT01 is DONE (2026-08-21) and is the only row here that has been built. The
  # remaining ten are TODO and still unplanned; none may start until its own
  # plan.md is written and confirmed (or AUTO-CONFIRMED under the unattended rule).
  # ---------------------------------------------------------------------------

  - id: FEAT01-foundation
    slug: foundation
    title: Flutter scaffold, drift on a background isolate, first migration
    status: DONE
    plan: pm/issues/feat01-foundation/plan.md
    depends_on: [ISSUE-007, ISSUE-008, ISSUE-009]
    traces_to: []
    summary: >-
      DONE 2026-08-21. The app compiles: all seven ERD tables at schemaVersion 1 in
      app/lib/src/{accounts,transactions,budgeting,settings}, AppDatabase on a background
      isolate via drift_flutter's driftDatabase() (which calls
      NativeDatabase.createBackgroundConnection, the same isolate guarantee
      createInBackground gives), the v1 schema snapshot committed, one seeded Settings row
      at IDR, and four green tests. Every amount is an IntColumn; all three enums stored by
      text, never index. No screens, no DAOs, no providers beyond appDatabaseProvider (D5).
      Also the first issue to test context/coding-conventions/ against a real toolchain and
      correct it: real resolved versions in riverpod.md, the driftDatabase() substitution in
      drift.md, and constant_identifier_names disabled in dart-and-flutter.md so the enum
      values stay spelled as docs/enums.md spells them.

