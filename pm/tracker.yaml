  - id: UC09-review-and-correct
    slug: review-and-correct
    title: Review and correct what was recorded
    status: DONE
    plan: pm/issues/uc09-review-and-correct/plan.md
    depends_on: [UC04-record-money-movement]
    traces_to: [UC-09]
    summary: >-
      The transaction list, plus editing or deleting any row on it - closes FR-18 for
      Transaction. DONE 2026-08-23: AUTO-CONFIRMED plan (both OPEN questions, Q3 and Q4,
      checked and cited through as not blocking - D6). TransactionDao gained the two
      methods class-transactions.drawio named for it from the start: watchAll() (a
      two-sided LEFT JOIN against Accounts for both side names, in-module join per
